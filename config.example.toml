# Ultron runner config. install.ps1 copies this to %ProgramData%\Ultron\config.toml.
# No secret lives in this file: the runner key is read from the file named below (or the
# ULTRON_BACKBONE_KEY environment variable). David pastes the key David issued; nobody else.

[backbone]
url = "https://backbone.example.com"           # David: the backbone API base URL (https only)
actor = "ultron-runner"                         # the runner's own backbone actor
domain = "compute"                              # the runner's card domain (never care/household/finance)
key_file = "%ProgramData%\\Ultron\\runner.key"  # one line: the runner actor's API key

[runner]
poll_seconds = 60          # a dispatched card starts within one poll
heartbeat_seconds = 60
progress_seconds = 60      # progress events to the card at most this often
max_attempts = 3           # retryable failures, then the card goes to needs_david
sleep_gap_seconds = 90     # a clock jump longer than this = Ultron was asleep
state_dir = "%ProgramData%\\Ultron\\state"   # SQLite checkpoints + logs
# Jobs may only read inputs and write outputs under these folders.
allowed_roots = ["D:\\Photos", "D:\\Videos", "%USERPROFILE%\\Dropbox"]
# Extra job-kind modules (each calls ultron_worker.jobs.register); no core change needed.
job_modules = []

# Optional: name -> base path of the media roots tag records are keyed by (root + relative path,
# so the index survives a NAS swap). Without this table each allowed_roots entry is a root named
# after its final folder, e.g. "\\\\GUILD-NAS\\GUILD-RAW-Media" -> GUILD-RAW-Media.
# [media_roots]
# GUILD-RAW-Media = "\\\\GUILD-NAS\\GUILD-RAW-Media"

# The NAS media inbox watcher (<root>/<inbox>/<source>/<YYYY-MM-DD>/). Off until David has
# confirmed the live media root and inbox folder; root names a [media_roots] entry.
# [media_inbox]
# enabled = false
# root = "GUILD-RAW-Media"
# inbox = "inbox"
# watcher = "ultron-inbox"        # the heartbeat's watcher id on the backbone
# interval_seconds = 300          # cadence; a sync command re-scans immediately
# settle_seconds = 60             # files younger than this may still be copying
# model = "muse-glimmer:30b"      # Glimmer, the local vision default
# tag_per_pass = 50
# review_after_attempts = 3       # unusable model replies before an item is flagged
#
# Source folders under the inbox. Unlisted folders are native feeders named after the folder.
# [media_inbox.feeders.phone]
# kind = "native"                 # filled by the NAS (Synology Photos / Dropbox sync)
# display_name = "Phone"
# folder = "phone"
# [media_inbox.feeders.scanner]
# kind = "api"                    # pulled by a puller a job_modules module registers
#
# Subject folder (root-relative) -> tags that file an item there. No single best match =
# the item stays in the inbox flagged for review.
# [media_inbox.subjects]
# "Brands/Guild" = ["guild", "guild logo"]

# API feeders (need [media_inbox]): each pulls on its cadence and on Sync now into
# <inbox>/<folder>/<YYYY-MM-DD>/ with a manifest.jsonl line per file. Read-only against the
# source. A missing id or credential reports status error "not configured" and stops.
# [media_feeders.discord]
# enabled = false
# guild_id = ""                   # the Guild Hall server id (David)
# thread_id = ""                  # the ONE thread to read (David)
# token_file = ""                 # David's bot token file; or set ULTRON_DISCORD_TOKEN
# interval_seconds = 300
# [media_feeders.gdrive]
# enabled = false
# folder_id = ""                  # the ONE Drive folder (David)
# auth_file = ""                  # David's Google sign-in (python -m ultron_worker.feeds.gdrive_auth)
# interval_seconds = 300

[ollama]
url = "http://127.0.0.1:11434"   # localhost only; the runner is Ollama's only caller

[gui]
enabled = true
host = "127.0.0.1"               # localhost only
port = 8765                      # http://127.0.0.1:8765/
